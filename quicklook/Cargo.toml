[package]
name = "quicklook"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "An easy to use Rust wrapper for Apple's QuickLookUI API."
keywords = ["macos", "appkit", "quicklook-ui", "apple"]
categories = ["os::macos-apis", "api-bindings"]
readme = "../README.md"

[dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSImage", "NSPanel"] }
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSArray", "NSGeometry"] }
objc2-quick-look-ui = "0.3.2"
